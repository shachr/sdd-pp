# split-plan schema for OpenSpec (tested with @fission-ai/openspec 1.14.1). Hand-written.
# The PARENT of a split change: a control plane with NO requirement names and NO behaviour.
# Behaviour (and every requirement / scenario name) lives in the child changes (schema
# handoff-driven), one per slice. OpenSpec sets skip_specs: true for a schema without a specs
# artifact; archive the parent last with `openspec archive <id> --skip-specs`.
# Created by `/split-apply <change>` (split.mjs apply; converts the original change). Child ids: <parent>-<nn>-<slice>.
name: split-plan
version: 2
description: Parent of a split change - a control plane (why/scope, the approved slices with status marks, the split commit); no requirement names, no behaviour, no handoff, never verified - proposal → slices
artifacts:
  - id: proposal
    generates: proposal.md
    description: Why and scope of the whole feature (no requirement or scenario names)
    template: proposal.md
    instruction: |
      The parent keeps the original change's proposal.md as the why and scope of the whole
      feature. It must not name requirements or scenarios (`split.mjs loss` fails on any
      original name in the parent's proposal.md, slices.md or tickets/); rephrase as scope.
    requires: []
  - id: slices
    generates: slices.md
    description: The approved slices (id, goal, capabilities, depends_on, flag, ticket, status) and the split commit
    template: slices.md
    instruction: |
      slices.md is written by `/split-apply <change>` from the engineer-approved
      execution/split-proposal.md. Rules:
      - Slice ids follow `<parent>-<nn>-<slice>` (e.g. add-text-stats-01-core, add-text-stats-02-cli,
        add-text-stats-99-remove-flag): the proposal lists only the slice part and `- order: NN`
        (two digits, 01 first; the flag cleanup slice uses 99); /split-apply builds the full id and
        refuses a full id that does not match. A re-split continues the numbering.
      - Control plane only: no requirement or scenario names, no behaviour (SHALL/MUST, WHEN/THEN).
        Those live in the child deltas (openspec/changes/<slice>/specs/).
      - Front matter: parent, approved_by, split_at, split_commit. The loss-check baseline is the
        original change's deltas at split_commit (git show).
      - Each slice: id (= child change name), goal, capabilities, depends_on, flag (only when the
        slice gates user-visible behaviour), removes_flag (cleanup slice, always planned when a
        flag exists), ticket, status (planned | in-progress - the engineer's mark,
        `/split-mark <parent> <slice> in-progress`). Done = the child's archived folder is on main.
      - Deliberate differences from the original (dropped, added, renamed_from, split_from) are
        "## Split notes" lines in the CHILD's proposal.md, never here.
      - Re-split a slice with the same gate (/split-check <slice>): new slices join this parent
        (no nested parents).
      Checks: `split.mjs loss <id>` after the split and after any child delta edit;
      `/split-next <id>` for the ready / parallel-safe report and tickets of READY slices.
    requires:
      - proposal
apply:
  requires:
    - slices
  instruction: |-
    A split parent is never implemented, handed off or verified (do not run /opsx:apply or
    /opsx:verify on it). Work happens in the child changes:
    `/split-next <parent>` lists READY slices (all depends_on
    done) and parallel-safe pairs (no dependency, no shared capability). Each engineer marks the
    slice in-progress (`/split-mark <parent> <slice> in-progress`), branches from main, runs the slice's short design session (reading the
    parent's execution/ session file), /handoff <slice>, and follows the printed next steps; the
    slice's archive is committed in its own PR with its code. When every slice is done:
    `/split-archive <parent>` (final loss check, then `openspec archive <parent> --skip-specs -y`).
